name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    name: RiseKit (Linux swift test)
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Install system SQLite headers (GRDB systemLibrary on Linux)
        run: |
          apt-get update -qq
          apt-get install -y -qq libsqlite3-dev
      - name: Run package tests
        run: swift test --package-path Packages/RiseKit
      - name: Zero-network gate
        run: bash scripts/check_zero_network.sh
      - name: Gitignore keeps signing material out
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for f in fake.p8 fake.p12 fake.mobileprovision fake.cer; do
            touch "$f"
            git check-ignore -q "$f" || { echo "FAIL: $f is not gitignored"; exit 1; }
            rm "$f"
          done
          echo "Signing-material gitignore check: PASS"

  ios-build:
    name: iOS build + iPhone-only + toolchain pin + UI tests
    # macos-26 runner images carry Xcode 26.0.1 but lack the iOS 26.0
    # simulator runtime (xcodebuild: "iOS 26.0 is not installed"). The
    # macos-15 image hosts the same exact pin (Xcode 26.0.1 / 17A400)
    # WITH the 26.0 runtime installed — proven by split-slip/seat-weave/
    # catch-tally CI on the same pin. Scripts/ci.sh enforces the exact
    # pin via select_xcode.py against toolchain.json; a missing pin is an
    # environment acceptance blocker, never a silent substitution.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run pinned simulator validation
        timeout-minutes: 38
        run: Scripts/ci.sh "$TARGET_SHA"

      - name: Upload results and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ci-${{ env.TARGET_SHA }}
          path: build/ci-artifacts
          if-no-files-found: warn
          retention-days: 14
